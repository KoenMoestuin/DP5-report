  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100vh;background:#111;font-family:'Nunito',sans-serif;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center}
    @keyframes popIn{0%{opacity:0;transform:scale(.55) translateY(6px)}65%{transform:scale(1.06) translateY(-1px)}80%{transform:scale(.97)}100%{opacity:1;transform:scale(1) translateY(0)}}
    .wrap{width:100%;max-width:1100px;margin:0 auto}

<body>

<div id="root"></div>
<script src="404044c8-b537-460a-b324-0c18e0ac9832" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="ff80ebeb-5de1-4ff5-b22a-c2dfe36f131f" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="0190bdfe-9780-4c8f-9162-0c9000dcd17b" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel">
// ── Future features ───────────────────────────────────────────────────────────
function FutureFeatureGenereer(){
  const [hov,setHov]=React.useState(false);
  return(
    <div onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
      style={{background:"#111",borderBottom:"1px solid rgba(255,255,255,.06)",padding:"32px 36px",display:"flex",gap:48,alignItems:"center",position:"relative",overflow:"hidden",cursor:"default",flex:1}}>
      <div style={{flexShrink:0,width:120,height:90,position:"relative"}}>
        {[2,1,0].map(i=>(
          <div key={i} style={{position:"absolute",left:i*8,top:i*6,width:72,height:88,background:i===0?"rgba(255,255,255,.12)":"rgba(255,255,255,.06)",border:"1px solid rgba(255,255,255,.15)",borderRadius:6,transition:`transform 320ms ease ${i*60}ms`,transform:hov?`translate(${-i*12}px, ${-i*6}px) rotate(${(i-1)*4}deg)`:"none",display:"flex",flexDirection:"column",gap:4,padding:"10px 8px"}}>
            {[...Array(4)].map((_,j)=><div key={j} style={{height:4,borderRadius:2,background:`rgba(255,255,255,${j===0?.25:.1})`,width:j===3?"55%":"85%"}}/>)}
          </div>
        ))}
        <div style={{position:"absolute",right:-10,bottom:-4,transition:"transform 300ms ease, opacity 300ms ease",transform:hov?"translate(-4px,-8px)":"translate(0,0)",opacity:hov?1:.35}}>
          <svg viewBox="0 0 40 20" width="38" height="19" fill="none"><circle cx="10" cy="10" r="8" stroke="#6f9ec4" strokeWidth="1.8"/><circle cx="30" cy="10" r="8" stroke="#6f9ec4" strokeWidth="1.8"/><path d="M18 9.5Q20 8 22 9.5" stroke="#6f9ec4" strokeWidth="1.8" strokeLinecap="round"/></svg>
        </div>
      </div>
      <div style={{flex:1}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
          <div style={{background:"rgba(255,255,255,.07)",border:"1px solid rgba(255,255,255,.10)",borderRadius:999,padding:"3px 12px",fontSize:9,fontWeight:700,color:"rgba(255,255,255,.4)",letterSpacing:".12em",textTransform:"uppercase"}}>Binnenkort</div>
          <div style={{background:"#6f9ec422",border:"1px solid #6f9ec444",borderRadius:999,padding:"3px 12px",fontSize:9,fontWeight:700,color:"#6f9ec4"}}>AI · Generatief</div>
        </div>
        <div style={{fontFamily:"'Sora',sans-serif",fontWeight:800,fontSize:26,color:"#faf7f2",lineHeight:1.1,letterSpacing:"-.02em",marginBottom:10}}>Genereer een bril<br/>uit documenten.</div>
        <div style={{fontSize:13,color:"rgba(255,255,255,.45)",lineHeight:1.65,maxWidth:480}}>Upload een rapport, interview of beleidsdocument en laat de AI een perspectief distilleren. Het document wordt geanalyseerd en omgezet naar een frame met kernzin, verhaal en kaartjes.</div>
      </div>
    </div>
  );
}

function FutureFeatureVergelijk(){
  const [hov,setHov]=React.useState(false);
  return(
    <div onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
      style={{background:"#111",padding:"32px 36px",display:"flex",gap:48,alignItems:"center",position:"relative",overflow:"hidden",cursor:"default",flex:1}}>
      <div style={{flexShrink:0,width:120,height:90,position:"relative",display:"flex",alignItems:"center",justifyContent:"center"}}>
        <div style={{position:"absolute",left:0,top:"50%",transform:`translateY(-50%) translateX(${hov?0:16}px)`,transition:"transform 380ms cubic-bezier(.34,1.36,.64,1)",opacity:hov?1:.5}}>
          <svg viewBox="0 0 40 20" width="44" height="22" fill="none"><circle cx="10" cy="10" r="8.5" stroke="#d96b3f" strokeWidth="2"/><circle cx="30" cy="10" r="8.5" stroke="#d96b3f" strokeWidth="2"/><path d="M18.5 9.5Q20 8 21.5 9.5" stroke="#d96b3f" strokeWidth="2" strokeLinecap="round"/></svg>
        </div>
        <div style={{position:"absolute",right:0,top:"50%",transform:`translateY(-50%) translateX(${hov?0:-16}px)`,transition:"transform 380ms cubic-bezier(.34,1.36,.64,1) 80ms",opacity:hov?1:.5}}>
          <svg viewBox="0 0 40 20" width="44" height="22" fill="none"><circle cx="10" cy="10" r="8.5" stroke="#6f9ec4" strokeWidth="2"/><circle cx="30" cy="10" r="8.5" stroke="#6f9ec4" strokeWidth="2"/><path d="M18.5 9.5Q20 8 21.5 9.5" stroke="#6f9ec4" strokeWidth="2" strokeLinecap="round"/></svg>
        </div>
        {hov&&[...Array(3)].map((_,i)=>(
          <div key={i} style={{position:"absolute",top:"50%",left:"50%",width:5,height:5,borderRadius:"50%",background:"#e8c66a",transform:`translate(-50%,-50%) translateY(${(i-1)*14}px)`,animation:"popIn .28s cubic-bezier(.34,1.56,.64,1) forwards",animationDelay:`${i*80}ms`,opacity:0}}/>
        ))}
      </div>
      <div style={{flex:1}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
          <div style={{background:"rgba(255,255,255,.07)",border:"1px solid rgba(255,255,255,.10)",borderRadius:999,padding:"3px 12px",fontSize:9,fontWeight:700,color:"rgba(255,255,255,.4)",letterSpacing:".12em",textTransform:"uppercase"}}>Binnenkort</div>
          <div style={{background:"#e8c66a22",border:"1px solid #e8c66a44",borderRadius:999,padding:"3px 12px",fontSize:9,fontWeight:700,color:"#e8c66a"}}>Analyse · Spanning</div>
        </div>
        <div style={{fontFamily:"'Sora',sans-serif",fontWeight:800,fontSize:26,color:"#faf7f2",lineHeight:1.1,letterSpacing:"-.02em",marginBottom:10}}>Vergelijk brillen en<br/>ontdek de spanning.</div>
